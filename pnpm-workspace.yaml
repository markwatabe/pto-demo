# @apygee packages install from npm (published in lockstep with the sibling
# ../components repo). For live local development against that checkout, use
# `pnpm link ../components/packages/<name>` ad hoc.
packages:
  - '.'

# pnpm blocks install scripts by default. esbuild (a Vite dependency)
# postinstalls its native binary; allow only that.
allowBuilds:
  esbuild: true
